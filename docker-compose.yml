version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: policylens-db
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: policylens
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: